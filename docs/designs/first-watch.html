<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>First Watch — Thunder FX</title>
    <link rel="stylesheet" href="keep.css" />
  </head>
  <body class="keep">
    <p class="kicker">FIRST WATCH</p>
    <h1>Light the brazier</h1>
    <section>
      <h2>Empty — Oaths</h2>
      <label><input type="checkbox" /> Stability AI Community License</label>
      <label><input type="checkbox" /> Gemma Terms of Use</label>
      <button disabled>Continue</button>
    </section>
    <section>
      <h2>Loading — Augury</h2>
      <p role="status">Reading the signs…</p>
    </section>
    <section>
      <h2>Success — Scribing complete</h2>
      <p>The brazier is lit. The studio opens.</p>
      <progress value="100" max="100"></progress>
    </section>
    <section>
      <h2>Error</h2>
      <p>The signs fail.</p>
      <pre>CUDA not found. Install an NVIDIA driver and CUDA-enabled PyTorch.</pre>
      <button>Probe again</button>
    </section>
  </body>
</html>
