name: Release

# Tag a release commit and push the tag:
#
#   npm run version:set 0.5.0 && npm install
#   git commit -am "release: 0.5.0" && git tag v0.5.0 && git push --follow-tags
#
# Needs two repository secrets, generated once with
# `npx @tauri-apps/cli signer generate -w ~/.tauri/thunder-fx.key`:
#
#   TAURI_SIGNING_PRIVATE_KEY           contents of the generated private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the password given at generation
#   TAURI_UPDATER_PUBKEY                contents of the generated .pub file
#
# Without them the job fails at the signing step rather than shipping an
# installer the updater can never verify.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The tag is the source of truth: a v0.5.0 tag must not build a 0.4.0 exe.
      - name: Check the tag matches the manifests
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm run version:check
          manifest=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest." >&2
            echo "Run: npm run version:set $tag" >&2
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Stamp the updater public key into the release config
        shell: bash
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$PUBKEY" ]; then
            echo "TAURI_UPDATER_PUBKEY is not set; the updater would ship unverifiable." >&2
            exit 1
          fi
          node -e '
            const fs = require("fs")
            const file = "src-tauri/tauri.updater.conf.json"
            const text = fs.readFileSync(file, "utf8")
            fs.writeFileSync(file, text.replace("__TAURI_UPDATER_PUBKEY__", process.env.PUBKEY.trim()))
          '

      - name: Build the signed installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Thunder FX ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed in this release.
          releaseDraft: true
          args: --bundles nsis,updater --config src-tauri/tauri.updater.conf.json
