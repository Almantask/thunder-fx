[package]
name = "thunder-fx"
version = "0.4.0"
description = "Thunder FX desktop studio"
authors = ["Thunder FX"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "thunder_fx_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# The updater carries no endpoint or public key in the default config, so a
# local build registers it and reports "not configured" instead of failing to
# compile. Release builds merge src-tauri/tauri.updater.conf.json over the top.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
hound = "3"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
