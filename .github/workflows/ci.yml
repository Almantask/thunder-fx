name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff
      # Formatting is not enforced yet: `ruff format engine .cursor/hooks`
      # would rewrite most of worker.py in one go. Adopt it as its own commit,
      # then add `ruff format --check` here.
      - name: Ruff lint
        run: ruff check engine .cursor/hooks

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Worker tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install soundfile
          python engine/test_worker.py
      - name: Rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
